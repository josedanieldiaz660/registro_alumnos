<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Carreras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
  <div class="navbar-unified">
    <div class="university-header">
        <h1 class="university-title">SISTEMA GESTION UNIVERSIDAD DE CHASCOMUS</h1>
    </div>
    <div class="nav-container">
    <ul class="nav nav-pills justify-content-center my-2">
      <li class="nav-item">
        <a class="nav-link" href="index1.html">INICIO</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="index.html">ESTUDIANTES</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="carreras.html">CARRERAS</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="categorias.html">FACULTADES</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="login.html">ACCESO USUARIO</a>
      </li>
    </ul>
  </div>

  <div class="container mt-5">
    <main>
      <h1 class="text-center mb-4">Gestión de Carreras</h1>

      <section class="mb-5 p-4 border rounded shadow-sm">
        <h2 class="mb-4">Registrar/Actualizar Carrera</h2>
        <form id="careerForm">
          <div class="mb-3">
            <label for="careerCode" class="form-label">Código de Carrera</label>
            <input type="text" id="careerCode" class="form-control" readonly required>
          </div>
          <div class="mb-3">
            <label for="careerName" class="form-label">Nombre de Carrera</label>
            <input type="text" id="careerName" class="form-control" placeholder="Ej. Ingeniería de Sistemas" required>
          </div>
          <div class="mb-3">
            <label for="facultySelect" class="form-label">Facultad</label>
            <select id="facultySelect" class="form-select" required>
              <option value="">Cargando facultades...</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="categorySelect" class="form-label">Nivel</label>
            <select id="categorySelect" class="form-select" required>
              <option value="">Seleccione nivel</option>
              <option value="Grado">Grado</option>
              <option value="Posgrado">Posgrado</option>
              <option value="Tecnicatura">Tecnicatura</option>
              <option value="Doctorado">Doctorado</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="duration" class="form-label">Duración (años)</label>
            <input type="number" id="duration" class="form-control" placeholder="Ej. 5" required min="1">
          </div>
          <button type="submit" class="btn btn-primary">Registrar</button>
          <button type="reset" class="btn btn-secondary">Limpiar</button>
        </form>
        <div id="careerResultDiv" class="mt-3 alert" style="display: none;"></div>
      </section>

      <section class="mb-5 p-4 border rounded shadow-sm">
        <h2 class="mb-4">Consultar Carrera por ID</h2>
        <div class="input-group mb-3">
          <input type="number" id="careerId" class="form-control" placeholder="Ingrese ID de la carrera" required>
          <button class="btn btn-info" id="searchCareerByIdBtn">Buscar Carrera</button>
        </div>
        <div id="getCareerResultDiv" class="mt-3 alert" style="display: none;"></div>
      </section>

      <section class="mb-5 p-4 border rounded shadow-sm">
        <h2 class="mb-4">Eliminar Carrera por ID</h2>
        <div class="input-group mb-3">
          <input type="number" id="deleteCareerId" class="form-control" placeholder="Ingrese ID de la carrera a eliminar" required>
          <button class="btn btn-danger" id="deleteCareerBtn">Eliminar Carrera</button>
        </div>
        <div id="deleteCareerResultDiv" class="mt-3 alert" style="display: none;"></div>
      </section>

      <section class="mb-5 p-4 border rounded shadow-sm">
        <h2 class="mb-4">Listado de Carreras</h2>
        <div class="table-responsive">
          <table class="table table-striped" id="careersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Facultad</th>
                <th>Nivel</th>
                <th>Duración</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <script src="./app.js"></script>
  <script>
  // Genera un código único para la carrera
  function generateCareerCode() {
    const now = new Date();
    const dateStr = now.getFullYear().toString() +
      String(now.getMonth() + 1).padStart(2, '0') +
      String(now.getDate()).padStart(2, '0');
    const random = Math.floor(Math.random() * 10000);
    return `CARR-${dateStr}-${random}`;
  }

  // Al cargar la página o resetear el formulario, asigna el código
  document.addEventListener('DOMContentLoaded', () => {
    const codeInput = document.getElementById('careerCode');
    if (codeInput) codeInput.value = generateCareerCode();

    const form = document.getElementById('careerForm');
    if (form) {
      form.addEventListener('reset', () => {
        setTimeout(() => {
          codeInput.value = generateCareerCode();
        }, 0);
      });
    }
  });
</script>
</body>
</html>
