    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar-unified">
        <div class="university-header">
            <h1 class="university-title">UNIVERSIDAD DE CHASCOMÚS</h1>
        </div>
        <div class="nav-container">
            <ul class="nav nav-pills justify-content-center my-2">
                <li class="nav-item">
                    <a class="nav-link" href="index1.html">INICIO</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html">ESTUDIANTES</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="carreras.html">CARRERAS</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="categorias.html">FACULTADES</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="login.html">ACCESO USUARIO</a>
                </li>
            </ul>
        </div>
    </div>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="login-form-box">
            <div class="login-header text-center">
                <h1 class="text-white">ACCESO</h1>
            </div>
            <form action="#" method="post">
                <div class="form-group mb-3">
                    <input type="text" id="matricula" name="matricula" class="form-control" placeholder="Número de matrícula" required>
                </div>
                <div class="form-group mb-3">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="login-button btn btn-primary w-100">Acceder</button>
                <div class="forgot-password text-center mt-2">
                    <a href="#">¿Olvidó su contraseña?</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
